<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" role="img" aria-label="GOODNBAD LED operator mask">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00e5ff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <radialGradient id="lens" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#0e1420"/><stop offset="1" stop-color="#05070c"/>
    </radialGradient>
    <filter id="led" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="50%" cy="46%" r="65%">
      <stop offset="0" stop-color="#0a0a0d" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="480" height="380" fill="#0a0a0d"/>
  <rect width="480" height="380" fill="url(#g)"/>

  <g>
    <!-- one glitch jump per loop -->
    <animateTransform attributeName="transform" type="translate" calcMode="discrete"
      values="0 0;0 0;-5 1;4 -2;0 0" keyTimes="0;0.9;0.925;0.95;0.975" dur="4s" repeatCount="indefinite"/>

    <!-- hood / helm silhouette -->
    <path d="M240 44 C150 44 96 104 96 196 L96 250 C96 312 150 344 240 344 C330 344 384 312 384 250 L384 196 C384 104 330 44 240 44 Z"
          fill="#0c0d12" stroke="url(#edge)" stroke-width="3"><animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></path>
    <path d="M240 44 C150 44 96 104 96 196 L96 250 C96 312 150 344 240 344 C330 344 384 312 384 250 L384 196 C384 104 330 44 240 44 Z"
          fill="none" stroke="#00e5ff" stroke-opacity="0.1" stroke-width="10"/>

    <!-- rivets / studs -->
    <g fill="#1f2530">
      <circle cx="118" cy="150" r="4"/><circle cx="118" cy="196" r="4"/><circle cx="118" cy="242" r="4"/>
      <circle cx="362" cy="150" r="4"/><circle cx="362" cy="196" r="4"/><circle cx="362" cy="242" r="4"/>
    </g>
    <!-- antenna ticks -->
    <rect x="196" y="34" width="24" height="8" rx="2" fill="#ff2e88" opacity="0.85"/>
    <rect x="260" y="34" width="24" height="8" rx="2" fill="#00e5ff" opacity="0.85"/>

    <!-- ===== WRENCH LED LENSES ===== -->
    <g>
      <!-- gaze dart -->
      <animateTransform attributeName="transform" type="translate" calcMode="discrete"
        values="0 0;-10 2;9 -2;0 4;0 0" keyTimes="0;0.24;0.5;0.74;0.88" dur="4s" repeatCount="indefinite"/>
      <circle cx="180" cy="188" r="50" fill="url(#lens)" stroke="url(#edge)" stroke-width="3"/>
      <circle cx="300" cy="188" r="50" fill="url(#lens)" stroke="url(#edge)" stroke-width="3"/>
      <circle cx="180" cy="188" r="50" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="9"/>
      <circle cx="300" cy="188" r="50" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="9"/>

      <g text-anchor="middle" font-family="'DejaVu Sans Mono','Courier New',monospace" font-weight="900" font-size="62">
        <!-- 5 Wrench moods, snap ~0.8s each -->
        <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.2" dur="4s" repeatCount="indefinite"/>
          <text x="182" y="210" fill="#ff2e88" opacity="0.55">X</text><text x="302" y="210" fill="#ff2e88" opacity="0.55">X</text>
          <text x="180" y="208" fill="#eafcff" filter="url(#led)">X</text><text x="300" y="208" fill="#eafcff" filter="url(#led)">X</text></g>
        <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.4" dur="4s" repeatCount="indefinite"/>
          <text x="184" y="210" fill="#ff2e88" opacity="0.55">&gt;</text><text x="300" y="210" fill="#ff2e88" opacity="0.55">&lt;</text>
          <text x="182" y="208" fill="#eafcff" filter="url(#led)">&gt;</text><text x="298" y="208" fill="#eafcff" filter="url(#led)">&lt;</text></g>
        <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.6" dur="4s" repeatCount="indefinite"/>
          <text x="182" y="212" fill="#ff2e88" opacity="0.55">+</text><text x="302" y="212" fill="#ff2e88" opacity="0.55">+</text>
          <text x="180" y="210" fill="#eafcff" filter="url(#led)">+</text><text x="300" y="210" fill="#eafcff" filter="url(#led)">+</text></g>
        <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.6;0.8" dur="4s" repeatCount="indefinite"/>
          <text x="182" y="212" fill="#ff2e88" opacity="0.55">!</text><text x="302" y="212" fill="#ff2e88" opacity="0.55">!</text>
          <text x="180" y="210" fill="#eafcff" filter="url(#led)">!</text><text x="300" y="210" fill="#eafcff" filter="url(#led)">!</text></g>
        <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.8" dur="4s" repeatCount="indefinite"/>
          <text x="184" y="206" fill="#ff2e88" opacity="0.55">^</text><text x="300" y="206" fill="#ff2e88" opacity="0.55">^</text>
          <text x="182" y="204" fill="#eafcff" filter="url(#led)">^</text><text x="298" y="204" fill="#eafcff" filter="url(#led)">^</text></g>
      </g>
    </g>

    <!-- voice-waveform mouth -->
    <g fill="#ff2e88" filter="url(#led)">
      <rect x="200" y="278" width="7" height="18" rx="3"><animate attributeName="height" values="18;5;18" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="278;291;278" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="215" y="274" width="7" height="26" rx="3"><animate attributeName="height" values="26;5;26" dur="1s" begin="0.12s" repeatCount="indefinite"/><animate attributeName="y" values="274;291;274" dur="1s" begin="0.12s" repeatCount="indefinite"/></rect>
      <rect x="230" y="270" width="7" height="34" rx="3"><animate attributeName="height" values="34;5;34" dur="1s" begin="0.24s" repeatCount="indefinite"/><animate attributeName="y" values="270;291;270" dur="1s" begin="0.24s" repeatCount="indefinite"/></rect>
      <rect x="245" y="274" width="7" height="26" rx="3"><animate attributeName="height" values="26;5;26" dur="1s" begin="0.12s" repeatCount="indefinite"/><animate attributeName="y" values="274;291;274" dur="1s" begin="0.12s" repeatCount="indefinite"/></rect>
      <rect x="260" y="278" width="7" height="18" rx="3"><animate attributeName="height" values="18;5;18" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="278;291;278" dur="1s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- scanline -->
  <rect x="96" y="0" width="288" height="2" fill="#00e5ff" opacity="0.28">
    <animate attributeName="y" values="48;340;48" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect width="480" height="380" fill="url(#vig)"/>
</svg>
